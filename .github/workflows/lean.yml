name: Lean
# Checks the proofs in proofs/: the build, the axiom audit and the certificate fixtures.
on:
  push:
    branches: [main]
    paths: ['proofs/**', '.github/workflows/lean.yml']
  pull_request:
    paths: ['proofs/**', '.github/workflows/lean.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # proofs/lakefile.toml requires the DecisionAnalysis.jl and FiniteKernels.jl proof
      # projects by relative path (Lake *path* dependencies), so a lone clone of this
      # repository cannot `lake build`. The three repositories are checked out side by side.
      - uses: actions/checkout@v4
        with:
          path: CategoricalDecisionAnalysis.jl
      - uses: actions/checkout@v4
        with:
          repository: ecorecipes/DecisionAnalysis.jl
          path: DecisionAnalysis.jl
      - uses: actions/checkout@v4
        with:
          repository: ecorecipes/FiniteKernels.jl
          path: FiniteKernels.jl
      - name: Use a local packages directory in CI (the shared one is a sibling path on developer machines)
        working-directory: CategoricalDecisionAnalysis.jl/proofs
        # Lake reads the packages directory from lake-manifest.json as well as lakefile.toml,
        # and logs "manifest out of date" when the two disagree, which --wfail turns into a
        # failure; so both files are rewritten.
        run: |
          sed -i 's#^packagesDir = .*#packagesDir = ".lake/packages"#' lakefile.toml
          python3 -c 'import json; p = "lake-manifest.json"; m = json.load(open(p)); m["packagesDir"] = ".lake/packages"; json.dump(m, open(p, "w"), indent=1)'
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: CategoricalDecisionAnalysis.jl/proofs
          use-github-cache: false
          use-mathlib-cache: 'true'
          build-args: "--wfail"
      - name: Axiom audit
        working-directory: CategoricalDecisionAnalysis.jl/proofs
        run: make audit
      - name: Certificate fixtures
        working-directory: CategoricalDecisionAnalysis.jl/proofs
        run: make check-fixtures
